# Mantém o nome que já estava no seu
spring.application.name=produtos-frontend

# Define a porta dinâmica para o Render conseguir rodar o projeto
server.port=${PORT:8080}

# Configuração para o Spring Boot servir seus arquivos HTML/JS/CSS estáticos
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Desabilitar o Thymeleaf (já que seu front é HTML/JS puro)
spring.thymeleaf.enabled=false

# Configurações de cache para produção (melhora a performance no Render)
spring.web.resources.cache.cachecontrol.max-age=3600
spring.web.resources.cache.cachecontrol.must-revalidate=true